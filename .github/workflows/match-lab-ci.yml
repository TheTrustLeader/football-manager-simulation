name: Match Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build and type-check
        run: npm run build

      - name: Print deterministic golden-output hash
        run: npm run golden:print

      - name: Run temporary tuning-seed calibration sweep
        run: npm run calibration:sweep -- 10000

      - name: Run tuning-seed evidence gate
        id: evidence
        continue-on-error: true
        run: npm run evidence -- 20000 tuning evidence/match-lab-evidence.json

      - name: Run behavioural and invariant tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Upload Match Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-lab-evidence
          path: evidence/match-lab-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce evidence and test gates
        if: always()
        run: |
          if [ "${{ steps.evidence.outcome }}" != "success" ] || [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Match Lab gate failed: evidence=${{ steps.evidence.outcome }}, tests=${{ steps.tests.outcome }}"
            exit 1
          fi

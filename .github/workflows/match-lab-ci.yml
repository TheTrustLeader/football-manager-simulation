name: Match Lab CI

on:
  push:
    # main AND the working prefixes the verify loop watches. Before this, the
    # workflow ran only on main and on pull_request, so an ordinary feature
    # branch never got a CI run at all - which is how ci/engine-guardrails-and-
    # golden was recorded "green, 46/46" on npm test alone and still turned main
    # red the first time its own new gate executed. Actions minutes are free on a
    # public repo; a branch with no CI run has no CI evidence.
    # verify-queue is deliberately absent: it is an orphan queue branch with no
    # package.json, so this workflow cannot run there.
    branches:
      - main
      - 'agent/**'
      - 'codex/**'
      - 'ci/**'
      - 'review-*/**'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and type-check
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Calibration safety gate (fails the build if the engine drifts out of band)
        # This is the step that can actually go red. npm run evidence plays 20,000
        # matches and compares goals per match, draw rate, home win rate, mirror
        # fairness and the strong/weak ability checks against ciGuardrails in
        # src/engine-config.ts, throwing if any of them breaks its band.
        # shell: bash is REQUIRED, not decoration. The Actions default is "bash -e",
        # which does NOT set pipefail, so piping into tee would report the exit code
        # of tee and this gate would pass while the engine was out of band - the
        # exact defect it exists to prevent. Verified 7 Sept 2026.
        #
        # No ALLOW_DIRTY_EVIDENCE here, deliberately. .gitignore keeps the tree
        # genuinely clean after install and build, so the evidence provenance guard
        # does its real job: it refuses to stamp a run against a commit whose source
        # has been altered. If this step ever fails with "source tree is dirty", a
        # build step is writing an untracked file - add it to .gitignore. Do NOT
        # silence the guard with the env var.
        shell: bash
        run: npm run evidence 2>&1 | tee calibration-evidence.txt

      - name: Run 10,000 seeded matches
        # Human-readable summary only. This step cannot fail on the numbers -
        # the gate above is what judges them.
        run: npm run simulate -- 10000 | tee simulation-summary.txt

      - name: Upload simulation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-lab-simulation-summary
          path: |
            simulation-summary.txt
            calibration-evidence.txt
            evidence/match-lab-evidence.json
          if-no-files-found: warn
          retention-days: 14

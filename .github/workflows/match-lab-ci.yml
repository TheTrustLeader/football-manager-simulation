name: Match Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build and type-check
        run: npm run build

      - name: Run behavioural and invariant tests
        run: npm test

      - name: Run tuning-seed evidence gate
        run: npm run evidence -- 20000 tuning evidence/match-lab-evidence.json

      - name: Upload Match Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-lab-evidence
          path: evidence/match-lab-evidence.json
          if-no-files-found: warn
          retention-days: 90

name: Match Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and type-check
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run 10,000 seeded matches
        run: npm run simulate -- 10000 | tee simulation-summary.txt

      - name: Upload simulation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-lab-simulation-summary
          path: simulation-summary.txt
          if-no-files-found: warn
          retention-days: 14
